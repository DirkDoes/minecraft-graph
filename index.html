<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Explore Minecraft items, mobs, structures, biomes, dimensions, status effects, and their relationships from the game.">
  <title>Minecraft Atlas</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="workspace">
    <aside class="sidebar" aria-label="Graph search and filters">
      <label class="version-control">Game version <select id="version" aria-label="Game version" disabled><option>Loading…</option></select></label>
      <div class="search-container">
        <div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Search any node…" aria-label="Search all nodes" autocomplete="off" aria-controls="item-list" disabled><kbd>/</kbd></div>
        <div id="search-results" class="search-results" hidden><div class="item-results-heading"><span id="result-count"></span> matches</div><div id="item-list" class="item-list" aria-label="Search results"></div></div>
      </div>
      <section class="filter-section"><div class="section-title"><h2>Nodes</h2><button id="toggle-nodes" class="text-button">Hide all</button></div><div id="node-filters" class="filter-tree"></div></section>
      <section class="filter-section relationships-section"><div class="section-title"><h2>Relationships</h2><button id="toggle-types" class="text-button">Hide all</button></div><label class="filter-label self-loop-control"><input id="self-loops" type="checkbox"><span class="filter-name">Show self-loops</span></label><div id="type-filters" class="filter-tree"></div></section>
      <div class="sidebar-footer" id="data-note">Loading game data…</div>
    </aside>
    <section class="graph-area" aria-label="Interactive knowledge graph">
      <div class="graph-top"><div class="view-modes" role="group" aria-label="Graph view mode"><button data-mode="all" aria-pressed="true">All</button><button data-mode="direct" aria-pressed="false" title="Only connections involving the selected node">Direct</button><button data-mode="nearby" aria-pressed="false" title="Direct neighbors and a faded second layer">Nearby</button></div><div class="graph-stats" aria-live="polite"><span><b id="node-count">—</b> nodes</span><span><b id="edge-count">—</b> connections</span></div></div>
      <canvas id="graph" tabindex="0" aria-label="Knowledge graph. Drag to pan, scroll to zoom, click a node to inspect. Arrow keys pan; plus and minus zoom; Escape clears selection."></canvas>
      <div id="loading" class="loading"><div class="loading-cube" aria-hidden="true"></div><h2>Loading graph</h2><p id="loading-text">Reading Minecraft data…</p></div>
      <div id="tooltip" class="graph-tooltip" hidden></div>
      <div class="graph-bottom"><span id="interaction-hint" class="interaction-hint">Drag to pan · Scroll to zoom · Select a node</span><div class="graph-controls" role="group" aria-label="Graph navigation"><button id="relayout" class="relayout-button" title="Arrange the visible graph and fit it on screen" aria-label="Rearrange visible graph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg></button><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-level">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit" class="fit-button" title="Fit visible graph" aria-label="Fit visible graph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div>
    </section>
    <aside id="details" class="details" aria-label="Selected node and relationships"><div class="empty-details"><p>Select a node to inspect its relationships.</p><div id="starter-items" class="starter-items"></div></div></aside>
  </main>
  <nav class="mobile-toolbar" aria-label="Graph tools">
    <button id="mobile-search" aria-haspopup="dialog" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>Search nodes…</button>
    <button id="mobile-filters" aria-haspopup="dialog" disabled>Filters</button>
  </nav>
  <div id="mobile-selection" class="mobile-selection" hidden>
    <button id="mobile-details" aria-haspopup="dialog"></button>
    <button id="mobile-clear" aria-label="Clear selection">×</button>
  </div>
  <dialog id="mobile-panel" class="mobile-sheet" aria-labelledby="mobile-panel-title">
    <div class="mobile-sheet-header"><h2 id="mobile-panel-title"></h2><button id="mobile-panel-close" aria-label="Close panel" autofocus>×</button></div>
    <div id="mobile-panel-content" class="mobile-sheet-content"></div>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
